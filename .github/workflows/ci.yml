name: CI/CD Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================================
  # 1. Job Test avec Matrice de versions Java (Bonus +1 point)
  # ============================================================================
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: ['17', '21']
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer le JDK Java ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}
          cache: 'maven'

      - name: Exécuter le script de contrôle de conformité du projet
        run: |
          sed -i 's/\r$//' scripts/check-project.sh
          bash scripts/check-project.sh

      - name: Exécuter la suite de tests unitaires et d'intégration
        run: mvn test

      - name: Sauvegarder les rapports de tests Surefire en artefact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-tests-java${{ matrix.java-version }}
          path: target/surefire-reports/*.xml

  # ============================================================================
  # 2. Job Docker Build et Publication (needs: test)
  # ============================================================================
  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion au registre GitHub Container Registry (GHCR)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraire les métadonnées de l'image (tags et labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=pr
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Construire l'image Docker (et publier si tag de version v*)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ============================================================================
  # 3. Job Déploiement Automatique en Staging et Contrôle de Santé (Bonus +2 pts)
  # ============================================================================
  deploy-staging:
    needs: docker-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Connexion au registre GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mettre en service la pile Staging avec Docker Compose
        env:
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          echo "IMAGE_TAG=${IMAGE_TAG}" > .env.deploy
          docker compose --env-file .env.deploy -f compose.staging.yaml up -d

      - name: Exécuter le contrôle de santé automatique wait-healthy.sh
        run: |
          sed -i 's/\r$//' scripts/wait-healthy.sh
          bash scripts/wait-healthy.sh

      - name: Nettoyer la pile Staging après validation
        if: always()
        run: |
          docker compose -f compose.staging.yaml down -v
